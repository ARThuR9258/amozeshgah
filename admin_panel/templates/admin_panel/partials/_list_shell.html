<div class="ap-page {{ page_accent|default:'ap-accent-indigo' }}">
  <header class="ap-page-hero">
    <div class="ap-page-hero-main">
      <div class="ap-page-icon"><i class="fas {{ page_icon|default:'fa-table' }}"></i></div>
      <div>
        <nav class="ap-page-breadcrumb" aria-label="breadcrumb">
          <a href="{% url 'admin_panel:dashboard' %}"><i class="fas fa-home"></i> داشبورد</a>
          <span>/</span>
          <span>{{ page_title }}</span>
        </nav>
        <h1>{{ page_title }}</h1>
        {% if page_subtitle %}<p class="ap-muted mb-0 small">{{ page_subtitle }}</p>{% endif %}
      </div>
    </div>
    <div class="ap-page-hero-actions">
      {% block list_header_actions %}{% endblock %}
      {% if create_url %}
      <button type="button" class="btn btn-primary ap-btn-primary rounded-pill px-4 shadow-sm"
              hx-get="{{ create_url }}" hx-target="#apModalBody" hx-swap="innerHTML">
        <i class="fas fa-plus ms-2"></i>افزودن
      </button>
      {% endif %}
    </div>
  </header>

  <div class="ap-data-card">
    <div class="ap-data-card-head">
      <h2><i class="fas fa-filter text-muted ms-2 small"></i>فهرست و جستجو</h2>
    </div>
    <div class="ap-data-card-body">
      {% block list_filters %}{% endblock %}
      <div id="{{ table_id }}"
           class="ap-table-wrap"
           hx-get="{{ table_url }}"
           hx-trigger="load, {{ refresh_event }} from:body"
           hx-target="#{{ table_id }}"
           hx-swap="innerHTML"
           hx-include="{{ filter_form_id|default:'#apFilterForm' }}">
        <div class="ap-loading py-5 text-center">
          <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
          <span class="d-block mt-2 ap-muted small">در حال بارگذاری…</span>
        </div>
      </div>
    </div>
  </div>
</div>
