<td class="text-end ap-actions">
  {% if detail_url %}
  <a href="{{ detail_url }}" class="btn btn-sm btn-light rounded-pill ap-btn-action" title="مشاهده"><i class="fas fa-eye"></i></a>
  {% endif %}
  {% if edit_url %}
  <button type="button" class="btn btn-sm btn-primary rounded-pill ap-btn-action" title="ویرایش"
          hx-get="{{ edit_url }}"
          hx-target="#apModalBody"
          hx-swap="innerHTML"
          hx-indicator="#apModalIndicator"><i class="fas fa-pen"></i></button>
  {% endif %}
  {% if delete_url %}
  <button type="button" class="btn btn-sm btn-outline-danger rounded-pill ap-btn-action ap-btn-delete" title="حذف"
          data-ap-delete="1"
          hx-post="{{ delete_url }}"
          hx-swap="none"
          hx-confirm="{{ delete_confirm|default:'حذف شود؟' }}"
          hx-disabled-elt="this"><i class="fas fa-trash"></i></button>
  {% endif %}
</td>
