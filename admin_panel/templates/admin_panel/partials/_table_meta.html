<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <span class="ap-count-badge">
    <i class="fas fa-list ms-1"></i>
    {% if page_obj.paginator.count %}{{ page_obj.paginator.count|default:0 }} مورد{% else %}بدون نتیجه{% endif %}
  </span>
  {% if page_obj.paginator.num_pages > 1 %}
  <span class="text-muted small">صفحه {{ page_obj.number }} از {{ page_obj.paginator.num_pages }}</span>
  {% endif %}
</div>
